aid: wunder
name: Wunder
description: Wunder (formerly Wunder Capital, wewunder.com, now wunderpower.com) is a
  commercial clean-energy company that deploys solar, battery storage, and EV charging
  infrastructure across real estate portfolios with no-CapEx energy solutions, managing
  projects from design through operations in 40+ US states. Backed by Techstars and a
  $650M partnership with Blackstone, Wunder runs its project development on Astra, a
  proprietary internal platform for energy data analysis, forecasting, and automation.
  Wunder publishes no public API or developer program.
